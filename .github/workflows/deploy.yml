name: Deploy to Cloudflare
on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Repository secret: scoped Cloudflare API token (Workers Scripts:Edit, D1:Edit).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Repository variable: the Cloudflare account that owns the findadumpster Worker.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp test
      # Hand-written SQL migrations, applied before the new code goes live. They must stay
      # backward compatible with the running version.
      - name: Apply D1 migrations
        run: pnpm db:migrate:remote
      - name: Deploy
        env:
          # Account subdomain for workers.dev readiness when a version has no preview URL.
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: pnpm exec void deploy --platform cloudflare --skip-migrations
